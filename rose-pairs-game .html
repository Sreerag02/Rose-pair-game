<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose Pairs - Happy Valentine's Day 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            transition: background 1.5s ease;
        }

        body.victory {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 50%, #c44569 100%);
        }

        #root {
            width: 100%;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 25px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            text-align: center;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: #e91e63;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
            max-width: 350px;
            margin-left: auto;
            margin-right: auto;
        }

        .card-tile {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border: 4px solid #fff;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card-tile::before {
            content: '💝';
            position: absolute;
            font-size: 36px;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .card-tile.flipped::before,
        .card-tile.matched::before {
            opacity: 0;
        }

        .card-tile span {
            position: relative;
            z-index: 1;
        }

        .card-tile.flipped {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            transform: rotateY(180deg);
            animation: flip 0.4s ease;
        }

        .card-tile.matched {
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            border-color: #4caf50;
            animation: match 0.6s ease;
            pointer-events: none;
        }

        .card-tile.wrong {
            animation: shake 0.5s ease;
        }

        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(180deg); }
        }

        @keyframes match {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15) rotate(5deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            font-size: 16px;
            font-weight: bold;
            color: #555;
        }

        .stat-item {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Victory Screen */
        .victory-screen {
            animation: fadeInScale 1s ease;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .big-rose {
            font-size: 120px;
            animation: roseBloom 2s ease;
            margin: 20px 0;
        }

        @keyframes roseBloom {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }

        .hearts-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .falling-heart {
            position: absolute;
            font-size: 30px;
            animation: fall 5s linear forwards;
            opacity: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .love-message {
            font-family: 'Dancing Script', cursive;
            font-size: 32px;
            color: #e91e63;
            margin: 20px 0;
            font-weight: 700;
            animation: fadeIn 2s ease;
            text-shadow: 2px 2px 8px rgba(233, 30, 99, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .partner-name {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: #d81b60;
            font-weight: normal;
            margin: 15px 0;
            text-shadow: 3px 3px 10px rgba(216, 27, 96, 0.4);
            animation: fadeIn 2.5s ease;
            letter-spacing: 2px;
        }

        .final-message {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-top: 25px;
            animation: fadeIn 3s ease;
        }

        .quote-box {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.3) 0%, rgba(255, 192, 203, 0.4) 100%);
            border-left: 4px solid #e91e63;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            animation: slideIn 3.5s ease;
            position: relative;
            overflow: hidden;
        }

        .quote-box::before {
            content: '✨';
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            animation: twinkle 2s ease infinite;
        }

        .quote-box::after {
            content: '✨';
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 24px;
            animation: twinkle 2s ease infinite 1s;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .quote-text {
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            color: #d81b60;
            font-weight: 700;
            line-height: 1.6;
            font-style: italic;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        .floating-petals {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            font-size: 20px;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .rose-types {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0;
        }

        .rose-type {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: gold;
            border-radius: 50%;
            animation: sparkle 1s ease-out forwards;
        }

        @keyframes sparkle {
            to {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }

        .celebration-text {
            font-size: 48px;
            margin: 20px 0;
            animation: pulse 1s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Sound effects using Web Audio API
        const useSound = () => {
            const audioContext = useRef(null);

            useEffect(() => {
                audioContext.current = new (window.AudioContext || window.webkitAudioContext)();
            }, []);

            const playFlip = () => {
                if (!audioContext.current) return;
                const oscillator = audioContext.current.createOscillator();
                const gainNode = audioContext.current.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.current.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioContext.current.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.current.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.2, audioContext.current.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.current.currentTime + 0.15);
                
                oscillator.start(audioContext.current.currentTime);
                oscillator.stop(audioContext.current.currentTime + 0.15);
            };

            const playMatch = () => {
                if (!audioContext.current) return;
                
                // Create a pleasant chord progression
                const notes = [
                    { freq: 523.25, start: 0 },      // C5
                    { freq: 659.25, start: 0.08 },   // E5
                    { freq: 783.99, start: 0.16 }    // G5
                ];
                
                notes.forEach(note => {
                    const oscillator = audioContext.current.createOscillator();
                    const gainNode = audioContext.current.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.current.destination);
                    
                    oscillator.type = 'triangle';
                    oscillator.frequency.value = note.freq;
                    
                    const startTime = audioContext.current.currentTime + note.start;
                    gainNode.gain.setValueAtTime(0.15, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.5);
                    
                    oscillator.start(startTime);
                    oscillator.stop(startTime + 0.5);
                });
            };

            const playWrong = () => {
                if (!audioContext.current) return;
                
                // Create a gentle "try again" sound - soft descending chord
                const notes = [
                    { freq: 523, start: 0 },     // C
                    { freq: 466, start: 0.08 },  // A#
                    { freq: 392, start: 0.16 }   // G
                ];
                
                notes.forEach(note => {
                    const oscillator = audioContext.current.createOscillator();
                    const gainNode = audioContext.current.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.current.destination);
                    
                    oscillator.type = 'triangle';
                    oscillator.frequency.value = note.freq;
                    
                    const startTime = audioContext.current.currentTime + note.start;
                    gainNode.gain.setValueAtTime(0.15, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);
                    
                    oscillator.start(startTime);
                    oscillator.stop(startTime + 0.4);
                });
            };

            const playVictory = () => {
                if (!audioContext.current) return;
                
                // Create a celebratory melody
                const melody = [
                    { freq: 523, time: 0 },     // C
                    { freq: 587, time: 0.12 },  // D
                    { freq: 659, time: 0.24 },  // E
                    { freq: 698, time: 0.36 },  // F
                    { freq: 784, time: 0.48 },  // G
                    { freq: 880, time: 0.60 },  // A
                    { freq: 988, time: 0.72 },  // B
                    { freq: 1047, time: 0.84 }  // C
                ];
                
                melody.forEach((note, i) => {
                    const oscillator = audioContext.current.createOscillator();
                    const gainNode = audioContext.current.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.current.destination);
                    
                    oscillator.type = 'triangle';
                    oscillator.frequency.value = note.freq;
                    
                    const startTime = audioContext.current.currentTime + note.time;
                    gainNode.gain.setValueAtTime(0.2, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
                    
                    oscillator.start(startTime);
                    oscillator.stop(startTime + 0.3);
                });
            };

            return { playFlip, playMatch, playWrong, playVictory };
        };

        function RosePairsGame() {
            const roses = ['🌹', '🥀', '🌺', '🌸', '🌼', '🌻', '🏵️', '💐'];
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [moves, setMoves] = useState(0);
            const [isChecking, setIsChecking] = useState(false);
            const [gameWon, setGameWon] = useState(false);
            const { playFlip, playMatch, playWrong, playVictory } = useSound();
            const partnerName = "Vaishu"; // CHANGE THIS TO YOUR PARTNER'S NAME

            useEffect(() => {
                initializeGame();
            }, []);

            const initializeGame = () => {
                const pairs = [...roses, ...roses];
                const shuffled = pairs.sort(() => Math.random() - 0.5);
                setCards(shuffled);
                setFlipped([]);
                setMatched([]);
                setMoves(0);
                setGameWon(false);
            };

            const handleCardClick = (index) => {
                if (isChecking || flipped.includes(index) || matched.includes(index) || flipped.length === 2) {
                    return;
                }

                playFlip();
                createSparkles(index);
                const newFlipped = [...flipped, index];
                setFlipped(newFlipped);

                if (newFlipped.length === 2) {
                    setIsChecking(true);
                    setMoves(moves + 1);
                    checkMatch(newFlipped);
                }
            };

            const checkMatch = (flippedIndices) => {
                const [first, second] = flippedIndices;
                
                if (cards[first] === cards[second]) {
                    setTimeout(() => {
                        playMatch();
                        const newMatched = [...matched, first, second];
                        setMatched(newMatched);
                        setFlipped([]);
                        setIsChecking(false);

                        if (newMatched.length === cards.length) {
                            setTimeout(() => {
                                playVictory();
                                setGameWon(true);
                                createHeartsRain();
                            }, 500);
                        }
                    }, 600);
                } else {
                    setTimeout(() => {
                        playWrong();
                        setFlipped([]);
                        setIsChecking(false);
                    }, 1000);
                }
            };

            const createSparkles = (index) => {
                const card = document.querySelectorAll('.card-tile')[index];
                if (!card) return;
                
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const sparkle = document.createElement('div');
                        sparkle.className = 'sparkle';
                        sparkle.style.left = '50%';
                        sparkle.style.top = '50%';
                        sparkle.style.setProperty('--x', `${(Math.random() - 0.5) * 100}px`);
                        sparkle.style.setProperty('--y', `${(Math.random() - 0.5) * 100}px`);
                        card.appendChild(sparkle);
                        setTimeout(() => sparkle.remove(), 1000);
                    }, i * 50);
                }
            };

            const createHeartsRain = () => {
                // Change background to rose tint
                document.body.classList.add('victory');
                
                const container = document.createElement('div');
                container.className = 'hearts-rain';
                document.body.appendChild(container);

                const roses = ['🌹', '🌹', '🌹', '🌺', '🌸', '💐'];
                
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        const rose = document.createElement('div');
                        rose.className = 'falling-heart';
                        rose.textContent = roses[Math.floor(Math.random() * roses.length)];
                        rose.style.left = Math.random() * 100 + '%';
                        rose.style.animationDelay = Math.random() * 1 + 's';
                        rose.style.animationDuration = (3 + Math.random() * 2) + 's';
                        container.appendChild(rose);
                        setTimeout(() => rose.remove(), 6000);
                    }, i * 80);
                }
            };

            return (
                <div className="container">
                    <div className="card">
                        {!gameWon ? (
                            <>
                                <div className="title">Matching Game</div>
                                <div className="subtitle">Find all the matching pairs!</div>
                                
                                <div className="stats">
                                    <div className="stat-item">Moves: {moves}</div>
                                    <div className="stat-item">Pairs: {matched.length / 2}/{roses.length}</div>
                                </div>

                                <div className="game-grid">
                                    {cards.map((rose, index) => {
                                        const isFlipped = flipped.includes(index);
                                        const isMatched = matched.includes(index);
                                        const isWrong = flipped.length === 2 && 
                                                       flipped.includes(index) && 
                                                       cards[flipped[0]] !== cards[flipped[1]];
                                        
                                        return (
                                            <div
                                                key={index}
                                                className={`card-tile ${
                                                    isFlipped || isMatched ? 'flipped' : ''
                                                } ${isMatched ? 'matched' : ''} ${
                                                    isWrong ? 'wrong' : ''
                                                }`}
                                                onClick={() => handleCardClick(index)}
                                            >
                                                {(isFlipped || isMatched) && <span>{rose}</span>}
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        ) : (
                            <div className="victory-screen">
                                <div className="floating-petals">
                                    <span className="petal" style={{left: '10%', animationDelay: '0s'}}>🌸</span>
                                    <span className="petal" style={{left: '25%', animationDelay: '1s'}}>💐</span>
                                    <span className="petal" style={{left: '75%', animationDelay: '2s'}}>🌺</span>
                                    <span className="petal" style={{left: '90%', animationDelay: '0.5s'}}>🌼</span>
                                </div>
                                
                                <div className="celebration-text">🎉 You Did It! 🎉</div>
                                <div className="big-rose">🌹</div>
                                <div className="love-message">Happy Rose Day!</div>
                                <div className="partner-name">{partnerName}</div>
                                
                                <div className="rose-types">
                                    {roses.map((rose, i) => (
                                        <div key={i} className="rose-type" style={{animationDelay: `${i * 0.1}s`}}>
                                            {rose}
                                        </div>
                                    ))}
                                </div>

                                <div className="final-message">
                                    You completed it in {moves} moves!<br/>
                                    Surprise! It's Rose Day! 🌹
                                </div>

                                <div className="quote-box">
                                    <div className="quote-text">
                                        Every flower reminds me of you,<br/>
                                        but you're the most beautiful rose of all
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RosePairsGame />);
    </script>
</body>
</html>
